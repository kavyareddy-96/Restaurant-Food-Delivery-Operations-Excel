<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#151b26"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#c08a1e"/>
    </linearGradient>
    <linearGradient id="cellGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b13b"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="cellSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg5)"/>

  <!-- soft glow behind chart area -->
  <ellipse cx="960" cy="220" rx="320" ry="220" fill="#d4a017" opacity="0.05"/>

  <!-- Excel spreadsheet grid, right half -->
  <g stroke="#d4a017" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="840" y1="0" x2="840" y2="400"/>
    <line x1="920" y1="0" x2="920" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1080" y1="0" x2="1080" y2="400"/>
    <line x1="1160" y1="0" x2="1160" y2="400"/>
    <line x1="680" y1="35" x2="1200" y2="35"/>
    <line x1="680" y1="85" x2="1200" y2="85"/>
    <line x1="680" y1="135" x2="1200" y2="135"/>
    <line x1="680" y1="185" x2="1200" y2="185"/>
    <line x1="680" y1="235" x2="1200" y2="235"/>
    <line x1="680" y1="285" x2="1200" y2="285"/>
    <line x1="680" y1="335" x2="1200" y2="335"/>
  </g>

  <!-- highlighted spreadsheet cells, muted gold/slate -->
  <g opacity="0.85">
    <rect x="761" y="86" width="78" height="48" fill="url(#cellGold)" opacity="0.22"/>
    <rect x="921" y="186" width="78" height="48" fill="url(#cellSlate)" opacity="0.30"/>
    <rect x="1001" y="36" width="78" height="48" fill="url(#cellGold)" opacity="0.22"/>
    <rect x="841" y="236" width="78" height="48" fill="url(#cellSlate)" opacity="0.24"/>
  </g>

  <!-- rising bar chart, bottom right -->
  <g opacity="0.60">
    <rect x="980" y="300" width="28" height="70" fill="url(#cellSlate)"/>
    <rect x="1024" y="260" width="28" height="110" fill="url(#cellGold)"/>
    <rect x="1068" y="225" width="28" height="145" fill="url(#cellSlate)"/>
    <rect x="1112" y="270" width="28" height="100" fill="url(#cellGold)"/>
    <rect x="1156" y="245" width="28" height="125" fill="url(#cellSlate)"/>
  </g>

  <!-- plate + fork/knife icon, left side, subtle -->
  <g opacity="0.14" stroke="#d4a017" stroke-width="5" fill="none">
    <circle cx="120" cy="250" r="62"/>
    <circle cx="120" cy="250" r="36"/>
    <line x1="42" y1="196" x2="42" y2="300"/>
    <line x1="35" y1="196" x2="35" y2="222"/>
    <line x1="42" y1="196" x2="42" y2="222"/>
    <line x1="49" y1="196" x2="49" y2="222"/>
    <line x1="198" y1="196" x2="198" y2="300"/>
    <path d="M198 196 q11 16 0 42"/>
  </g>

  <!-- faint delivery route -->
  <path d="M -20 95 C 220 40, 430 140, 650 75"
        fill="none" stroke="#d4a017" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round"/>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent5)"/>

  <!-- eyebrow tag -->
  <text x="90" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4"
        fill="#d4a017" font-weight="700">EXCEL DASHBOARD PROJECT</text>

  <!-- main title -->
  <text x="88" y="222" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#f1f5f9">
    Restaurant Delivery
  </text>
  <text x="88" y="284" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#f1f5f9">
    Operations Dashboard
  </text>

  <!-- subtitle -->
  <text x="90" y="330" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#94a3b8">
    Excel  •  Pivot Tables  •  Data Cleaning
  </text>

  <!-- bottom-left thin rule -->
  <rect x="90" y="348" width="120" height="3" fill="url(#accent5)"/>
</svg>
